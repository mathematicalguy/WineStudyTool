<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wine Study Tool</title>
  <link rel="stylesheet" href="./styles.css?v=3" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Wine Study Tool</h1>
      <div class="controls">
        <div class="map-menu-wrap">
          <button id="mapMenuBtn" class="mode-btn">Map v</button>
          <div id="mapMenu" class="map-menu" hidden></div>
        </div>
        <button id="setupModeBtn" class="mode-btn hide-mobile">Setup mode</button>
        <button id="studyModeBtn" class="mode-btn hide-mobile">Study mode</button>
        <button id="saveBtn" title="Download polygons data" class="hide-mobile">Download</button>
        <button id="loadBtn" title="Upload polygons data" class="hide-mobile">Upload</button>
        <button id="clearBtn" title="Clear unsaved polygons in setup mode" class="hide-mobile">Clear</button>
        <button id="resetZoomBtn" title="Reset zoom and pan (R)" class="hide-mobile">Reset View</button>
        <div class="quiz-settings-wrap">
          <button id="quizSettingsBtn" class="mode-btn">Study Settings ▾</button>
          <div id="quizSettingsMenu" class="quiz-settings-menu" hidden>
            <div id="quizSettingsBody"></div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="overlay"></div>
        <div class="mobile-study-overlay" id="mobileStudyOverlay">
          <div>Find region:</div>
          <div id="mobileTargetName" class="target-name"></div>
          <div class="mobile-study-status" id="mobileStudyStatus"></div>
        </div>
      </div>
      <aside>
        <div class="panel" id="setupPanel">
          <h2>Setup</h2>
          <div class="hint">Click to add points. Double-click to close polygon. Use Esc to cancel.<br>
          Mouse wheel to zoom. Right-click drag to pan. R to reset view.</div>
          <ul id="regionsList"></ul>
          <div id="categoryEditorsWrap" class="category-editors-wrap" hidden>
            <h3 id="categoryEditorsTitle" class="category-editors-title"></h3>
            <div id="categoryEditors"></div>
          </div>
        </div>
        <div class="panel" id="studyPanel" hidden>
          <h2>Study</h2>
          <div class="prompt">
            <div>Find region:</div>
            <div id="targetName" class="target-name"></div>
          </div>
          <div class="status" id="studyStatus"></div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Quiz modal -->
  <div id="quizModal" class="quiz-modal-overlay" hidden>
    <div class="quiz-modal">
      <div id="quizQuestion" class="quiz-question"></div>
      <div id="quizOptions" class="quiz-options"></div>
      <div id="quizFeedback" class="quiz-feedback"></div>
      <button id="quizNextBtn" class="quiz-next-btn" hidden>Continue</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".json" style="display: none;" />
  <script src="./quiz.js?v=1"></script>
  <script src="./app.js?v=4"></script>
</body>
</html>
